server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure correct MIME types are loaded to fix the 'missing-content-type' Nuclei warning
    include /etc/nginx/mime.types;

    # Explicitly map file extensions to their correct MIME types
    types {
        text/html              html htm shtml;
        text/css               css;
        application/javascript js;
        text/plain             txt;
        text/markdown          md;
    }

    # Fallback type if no extension matches (e.g., /.well-known/api-catalog)
    default_type application/octet-stream;
    
    # Force UTF-8 charset. Security scanners (like Nuclei) often flag 
    # "missing content-type" if the charset is missing on text files.
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;

        # --- Security Headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # React components use inline style attributes for dynamic dimensions and positions.
        # Scripts remain restricted to same-origin production bundles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://cxsbcsngqrjyjyarsomn.supabase.co https://migraine-tracker-monolith-w204dd.sliplane.app https://demo-api.migrainepulse.com https://api.openweathermap.org https://api.open-meteo.com https://services.swpc.noaa.gov https://www.temis.nl https://archive-api.open-meteo.com;" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # --- End Security Headers ---

        # Note: 'Missing-Content-Policy' isn't a standard header, but left as-is if you require it
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Missing-Content-Policy "require-corp" always;
        # --- End Security Headers ---

        # --- Caching & Data Clearance ---
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Clear-Site-Data '"cache", "cookies", "storage"' always;
    }

    # Optional: Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;

        # --- Security Headers (Must be repeated here because of the add_header directives below) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # --- End Security Headers ---

        add_header Pragma "public";
        add_header Expires "0";

        add_header Clear-Site-Data '"cache", "cookies", "storage"';

        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://cxsbcsngqrjyjyarsomn.supabase.co https://migraine-tracker-monolith-w204dd.sliplane.app https://demo-api.migrainepulse.com https://api.openweathermap.org https://api.open-meteo.com https://services.swpc.noaa.gov https://www.temis.nl https://archive-api.open-meteo.com;" always;
    }
}
